name: Temporary Furia GP PR Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'furia-gp-android/**'
      - 'furia-gp-build-trigger.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: furia-gp-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: furia-gp-apk
          path: furia-gp-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
