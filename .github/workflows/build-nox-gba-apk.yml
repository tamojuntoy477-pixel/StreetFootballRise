name: Build NOX GBA APK
on:
  push:
    branches: ["nox-gba"]
    paths:
      - "nox-gba/**"
      - ".github/workflows/build-nox-gba-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p nox-gba :app:assembleDebug
      - name: Rename APK
        run: cp nox-gba/app/build/outputs/apk/debug/app-debug.apk NOX-GBA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NOX-GBA-APK
          path: NOX-GBA.apk
          if-no-files-found: error
