name: Build Furia GP APK Direct

on:
  push:
    branches:
      - furia-gp-apk-build
    paths-ignore:
      - 'furia-gp-apk-chunk-*'
      - 'furia-gp-apk-info.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: furia-gp-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Split APK for retrieval
        run: |
          cp furia-gp-android/app/build/outputs/apk/debug/app-debug.apk Furia-GP-v1.apk
          sha256sum Furia-GP-v1.apk > furia-gp-apk-info.txt
          stat -c%s Furia-GP-v1.apk >> furia-gp-apk-info.txt
          base64 -w 0 Furia-GP-v1.apk | split -b 500000 - furia-gp-apk-chunk-

      - name: Commit APK chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add furia-gp-apk-chunk-* furia-gp-apk-info.txt
          git commit -m "Store compiled Furia GP APK chunks [skip ci]"
          git push
