name: Build Noxaria Atlas APK

on:
  push:
    branches:
      - noxaria-apk-20260926
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build clean APK
        run: gradle :noxapp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NoxariaAtlas-v1.1-APK
          path: noxapp/build/outputs/apk/debug/noxapp-debug.apk
